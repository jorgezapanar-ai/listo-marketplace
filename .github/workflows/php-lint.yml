name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Sintaxis PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Revisar sintaxis de todos los archivos PHP
        run: |
          failures=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failures=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $failures
