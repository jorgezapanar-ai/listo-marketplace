ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Carpetas internas: nunca servirlas directamente, aunque el .htaccess falle.
<DirectoryMatch "^/var/www/html/(app|docker|database|storage|templates|cron)(/|$)">
    Require all denied
</DirectoryMatch>
